# Variant A2: soft+hard mix — posterior top noise-rate fraction excluded (w=0),
# the rest keeps v2 calibrated soft weights (a DivideMix-like clean/noisy split
# driven by our unsupervised posterior).
# Quick comparison sweep: CIFAR-10 x {sym20, sym40} x 3 seeds.
dataset:
  file: configs/datasets/cifar10.yaml
  name: cifar10
noise:
  - file: configs/noise/symmetric.yaml
    rate: 0.2
  - file: configs/noise/symmetric.yaml
    rate: 0.4
model:
  file: configs/models/resnet18.yaml
seeds: [0, 1, 2]
noise_seed: run
stage: weighted

evidence:
  recipe: ema_loss_forgetting_conflict
  conflict_k: 20

quality:
  anchor_quantile: 0.8
  knn_k: 20
  stability_views: 2

matched_auc:
  eps: 0.1
  max_clean_per_noisy: 5

bootstrap:
  n_resamples: 1000
  ci: 0.95

reliability:
  method: knn_agreement
  weight_mode: calibrated
  hard_threshold: auto      # A2: exclude the top noise-rate fraction by posterior

mixture:
  n_restarts: 5
  max_iter: 1000
  n_bins: 5
