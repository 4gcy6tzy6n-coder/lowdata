# FINAL method (hard50) on CIFAR-100: generalization validation.
# Based on gate_a_cifar100.yaml + reliability hard exclusion (hard_frac 0.5).
dataset:
  file: configs/datasets/cifar100.yaml
  name: cifar100
noise:
  - file: configs/noise/symmetric.yaml
    rate: 0.2
  - file: configs/noise/symmetric.yaml
    rate: 0.4
  - file: configs/noise/asymmetric.yaml
    rate: 0.2
  - file: configs/noise/asymmetric.yaml
    rate: 0.4
model:
  file: configs/models/resnet18.yaml
seeds: [0, 1, 2]
noise_seed: run
stage: trace

evidence:
  recipe: ema_loss_forgetting_conflict
  conflict_k: 20

quality:
  anchor_quantile: 0.8
  knn_k: 20
  stability_views: 0        # skip Q3 on CIFAR-100 (speed); Q1/Q2 are the core

matched_auc:
  eps: 0.1
  max_clean_per_noisy: 5

bootstrap:
  n_resamples: 1000
  ci: 0.95

reliability:
  method: knn_agreement
  weight_mode: calibrated
  hard_threshold: auto
  hard_frac: 0.5

mixture:
  n_restarts: 5
  max_iter: 1000
  n_bins: 5
