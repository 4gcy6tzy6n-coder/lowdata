# CIFAR-10N real-annotation-noise diagnosis: Aggregate + Worse, 3 seeds.
# Only needs stages 01-04 (train standard model -> traces -> quality -> detectability).
dataset:
  file: configs/datasets/cifar10n.yaml
  name: cifar10n
noise:
  - file: configs/noise/cifar10n_aggre.yaml
  - file: configs/noise/cifar10n_worse.yaml
model:
  file: configs/models/resnet18.yaml
seeds: [0, 1, 2]
noise_seed: run
stage: trace

evidence:
  recipe: ema_loss_forgetting_conflict
  conflict_k: 20

quality:
  anchor_quantile: 0.8
  knn_k: 20
  stability_views: 2

matched_auc:
  eps: 0.1
  max_clean_per_noisy: 5

bootstrap:
  n_resamples: 1000
  ci: 0.95
