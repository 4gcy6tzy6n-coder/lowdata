# Variant A3 on asymmetric noise: adaptive noise rate from the mixture prior
# (targets over-suppression on asym) + mild sharpening p=2.
dataset:
  file: configs/datasets/cifar10.yaml
  name: cifar10
noise:
  - file: configs/noise/asymmetric.yaml
    rate: 0.2
  - file: configs/noise/asymmetric.yaml
    rate: 0.4
model:
  file: configs/models/resnet18.yaml
seeds: [0, 1, 2]
noise_seed: run
stage: weighted

evidence:
  recipe: ema_loss_forgetting_conflict
  conflict_k: 20

quality:
  anchor_quantile: 0.8
  knn_k: 20
  stability_views: 2

matched_auc:
  eps: 0.1
  max_clean_per_noisy: 5

bootstrap:
  n_resamples: 1000
  ci: 0.95

reliability:
  method: knn_agreement
  weight_mode: calibrated
  weight_power: 2.0
  rate_source: mixture

mixture:
  n_restarts: 5
  max_iter: 1000
  n_bins: 5
